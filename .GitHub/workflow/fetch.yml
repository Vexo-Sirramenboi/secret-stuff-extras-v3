name: Fetch Tuff Client 1.12.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Tuff Client 1.12.1
        run: |
          curl -L --fail --retry 3 \
            -o index.html \
            "https://gx-launcher.github.io/game/Tuff%20Client/index.html"

          ls -lh index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add Tuff Client 1.12.1"
          git push
